<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣旅遊景點互動地圖 Taiwan Travel Map</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS for Interactive Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                        },
                        ocean: {
                            500: '#0284c7',
                            600: '#0369a1',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Leaflet Marker Styling */
        .custom-div-icon {
            background: transparent;
            border: none;
        }
        .marker-pin {
            width: 36px;
            height: 36px;
            border-radius: 50% 50% 50% 0;
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -20px 0 0 -18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        .marker-pin i {
            transform: rotate(45deg);
            color: white;
            font-size: 14px;
        }
        .marker-pin:hover {
            transform: rotate(-45deg) scale(1.15);
            z-index: 999;
        }
        /* Marker Category Colors */
        .bg-cat-nature { background-color: #10b981; }
        .bg-cat-culture { background-color: #f59e0b; }
        .bg-cat-food { background-color: #ef4444; }
        .bg-cat-landmark { background-color: #6366f1; }
        .bg-cat-family { background-color: #ec4899; }

        /* Pulse animation for active marker */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .active-pulse {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased overflow-hidden">

        /* ==========================================================================
           2. STATE MANAGEMENT & MAP INITIALIZATION
           ========================================================================== */
        let map;
        let markersGroup;
        let currentRegionFilter = 'all';
        let currentCategoryFilter = 'all';
        let searchQuery = '';
        let itinerary = JSON.parse(localStorage.getItem('taiwan_trip_itinerary')) || [];

        /* Category Color & Icon Config */
        const categoryConfig = {
            nature: { label: '自然風光', class: 'bg-cat-nature', icon: 'fa-tree' },
            culture: { label: '人文歷史', class: 'bg-cat-culture', icon: 'fa-landmark' },
            food: { label: '美食夜市', class: 'bg-cat-food', icon: 'fa-utensils' },
            landmark: { label: '熱門地標', class: 'bg-cat-landmark', icon: 'fa-building' },
            family: { label: '親子戶外', class: 'bg-cat-family', icon: 'fa-child-reaching' }
        };

        window.onload = function() {
            initMap();
            renderAttractionList();
            updateItineraryBadge();
            setupSearchInput();
        };

        function initMap() {
            // Taiwan Center Coordinates & Initial Zoom level
            map = L.map('map', {
                zoomControl: false
            }).setView([23.7000, 120.9500], 8);

            // OpenStreetMap Tile Layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Add Custom Zoom Control to Bottom Right
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);
            updateMapMarkers(ATTRACTIONS);
        }

        function updateMapMarkers(filteredSpots) {
            markersGroup.clearLayers();

            filteredSpots.forEach(spot => {
                const config = categoryConfig[spot.category] || { class: 'bg-brand-600', icon: 'fa-location-dot' };
                
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `
                        <div class="marker-pin ${config.class}">
                            <i class="fa-solid ${config.icon}"></i>
                        </div>
                    `,
                    iconSize: [36, 36],
                    iconAnchor: [18, 36],
                    popupAnchor: [0, -36]
                });

                const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });

                // Custom Popup Box
                const popupContent = `
                    <div class="p-1 max-w-[200px]">
                        <img src="${spot.image}" class="w-full h-24 object-cover rounded-lg mb-2" onerror="this.src='https://placehold.co/300x200/10b981/ffffff?text=景點'">
                        <h4 class="font-bold text-slate-800 text-sm mb-0.5">${spot.name}</h4>
                        <p class="text-xs text-slate-500 mb-2">${spot.county} · ⭐ ${spot.rating}</p>
                        <button onclick="openModal(${spot.id})" class="w-full py-1 px-2 bg-brand-600 hover:bg-brand-700 text-white rounded text-xs font-medium transition">
                            檢視景點細節
                        </button>
                    </div>
                `;

                marker.bindPopup(popupContent);
                markersGroup.addLayer(marker);
            });
        }

        function renderAttractionList() {
            const container = document.getElementById('cards-container');
            const countEl = document.getElementById('attraction-count');

            let list = ATTRACTIONS.filter(spot => {
                const matchRegion = currentRegionFilter === 'all' || spot.region === currentRegionFilter;
                const matchCategory = currentCategoryFilter === 'all' || spot.category === currentCategoryFilter;
                const matchQuery = searchQuery === '' || 
                    spot.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    spot.county.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    spot.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
                return matchRegion && matchCategory && matchQuery;
            });

            // Sorting logic
            const sortBy = document.getElementById('sort-select').value;
            if (sortBy === 'rating') {
                list.sort((a, b) => b.rating - a.rating);
            } else if (sortBy === 'name') {
                list.sort((a, b) => a.name.localeCompare(b.name, 'zh-TW'));
            }

            countEl.textContent = list.length;
            updateMapMarkers(list);

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-map-location text-4xl mb-3 opacity-50"></i>
                        <p class="text-sm font-medium">找不到符合條件的景點</p>
                        <p class="text-xs text-slate-400 mt-1">請嘗試調整篩選地區或關鍵字</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map(spot => {
                const catInfo = categoryConfig[spot.category];
                const inItinerary = itinerary.some(item => item.id === spot.id);

                return `
                    <div class="bg-white rounded-xl border border-slate-200 shadow-xs hover:shadow-md transition duration-200 overflow-hidden flex flex-col sm:flex-row group cursor-pointer" onclick="focusOnSpot(${spot.id})">
                        <div class="sm:w-36 h-36 relative overflow-hidden flex-shrink-0">
                            <img src="${spot.image}" alt="${spot.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/400x300/10b981/ffffff?text=台灣景點'">
                            <span class="absolute top-2 left-2 px-2 py-0.5 rounded-md text-[10px] font-bold text-white ${catInfo.class}">
                                ${catInfo.label}
                            </span>
                        </div>
                        <div class="p-3.5 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-start justify-between">
                                    <h3 class="font-bold text-slate-800 text-base group-hover:text-brand-600 transition">
                                        ${spot.name}
                                    </h3>
                                    <span class="text-xs font-bold text-amber-500 flex items-center ml-1">
                                        <i class="fa-solid fa-star mr-0.5"></i>${spot.rating}
                                    </span>
                                </div>
                                <p class="text-xs text-slate-500 mt-1 flex items-center">
                                    <i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${spot.county}
                                </p>
                                <p class="text-xs text-slate-600 mt-2 line-clamp-2 leading-relaxed">
                                    ${spot.description}
                                </p>
                            </div>

                            <div class="mt-3 flex items-center justify-between border-t border-slate-100 pt-2">
                                <div class="flex space-x-1">
                                    ${spot.tags.slice(0, 2).map(tag => `<span class="bg-slate-100 text-slate-600 text-[10px] px-1.5 py-0.5 rounded">${tag}</span>`).join('')}
                                </div>
                                <div class="flex space-x-1" onclick="event.stopPropagation()">
                                    <button onclick="toggleItineraryItem(${spot.id})" class="p-1.5 text-xs rounded-lg ${inItinerary ? 'bg-brand-100 text-brand-700' : 'bg-slate-100 text-slate-600 hover:bg-brand-50 hover:text-brand-600'} transition" title="加到行程">
                                        <i class="fa-solid ${inItinerary ? 'fa-check' : 'fa-plus'}"></i>
                                    </button>
                                    <button onclick="openModal(${spot.id})" class="p-1.5 text-xs rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition" title="景點詳情">
                                        <i class="fa-solid fa-circle-info"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function focusOnSpot(id) {
            const spot = ATTRACTIONS.find(s => s.id === id);
            if (!spot) return;

            map.flyTo([spot.lat, spot.lng], 13, { duration: 1.2 });

            // Find marker & open popup
            markersGroup.eachLayer(layer => {
                const latLng = layer.getLatLng();
                if (Math.abs(latLng.lat - spot.lat) < 0.0001 && Math.abs(latLng.lng - spot.lng) < 0.0001) {
                    layer.openPopup();
                }
            });

            // On mobile, switch view automatically to map when clicking card
            if (window.innerWidth < 768) {
                setMobileTab('map');
            }
        }

        function setRegionFilter(region) {
            currentRegionFilter = region;
            document.querySelectorAll('.region-btn').forEach(btn => {
                if (btn.dataset.region === region) {
                    btn.className = 'region-btn active-region-btn px-3 py-1.5 rounded-full font-medium whitespace-nowrap bg-brand-600 text-white shadow-sm transition';
                } else {
                    btn.className = 'region-btn px-3 py-1.5 rounded-full font-medium whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition';
                }
            });
            renderAttractionList();
        }

        function setCategoryFilter(category) {
            currentCategoryFilter = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === category) {
                    btn.className = 'cat-btn active-cat-btn px-2.5 py-1 rounded-lg font-medium bg-slate-800 text-white whitespace-nowrap';
                } else {
                    btn.className = 'cat-btn px-2.5 py-1 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap';
                }
            });
            renderAttractionList();
        }

        function setupSearchInput() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');

            input.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                clearBtn.classList.toggle('hidden', searchQuery === '');
                renderAttractionList();
            });
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            searchQuery = '';
            document.getElementById('clear-search').classList.add('hidden');
            renderAttractionList();
        }

        function resetMapView() {
            map.flyTo([23.7000, 120.9500], 8, { duration: 1.0 });
        }

        function locateUser() {
            if (!navigator.geolocation) {
                showToast('您的瀏覽器不支援地理定位功能', 'error');
                return;
            }
            showToast('定位中...', 'info');
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    map.flyTo([latitude, longitude], 12);
                    L.marker([latitude, longitude]).addTo(map)
                        .bindPopup("<b>您的目前位置</b>").openPopup();
                    showToast('已定位至您的位置！', 'success');
                },
                () => {
                    showToast('無法取得您的定位位置', 'error');
                }
            );
        }

        function openModal(id) {
            const spot = ATTRACTIONS.find(s => s.id === id);
            if (!spot) return;

            const catInfo = categoryConfig[spot.category];
            document.getElementById('modal-img').src = spot.image;
            document.getElementById('modal-title').textContent = spot.name;
            document.getElementById('modal-rating').querySelector('span').textContent = spot.rating;
            document.getElementById('modal-location').querySelector('span').textContent = `${spot.county} · ${spot.address}`;
            document.getElementById('modal-category-badge').textContent = catInfo.label;
            document.getElementById('modal-category-badge').className = `px-3 py-1 rounded-full text-xs font-semibold text-white ${catInfo.class} shadow-md`;
            document.getElementById('modal-duration').textContent = spot.recommendedDuration;
            document.getElementById('modal-hours').textContent = spot.openHours;
            document.getElementById('modal-description').textContent = spot.description;

            // Render Tags
            const tagsContainer = document.getElementById('modal-tags');
            tagsContainer.innerHTML = spot.tags.map(tag => `
                <span class="px-2.5 py-1 bg-slate-100 text-slate-700 text-xs rounded-md border border-slate-200"># ${tag}</span>
            `).join('');

            // Google Maps Link
            document.getElementById('modal-google-maps').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.name + ' ' + spot.address)}`;

            // Add/Remove Itinerary Button State
            const btn = document.getElementById('modal-add-itinerary-btn');
            const inItinerary = itinerary.some(item => item.id === spot.id);
            if (inItinerary) {
                btn.className = "flex-1 py-2.5 px-4 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-medium text-sm transition shadow-sm flex items-center justify-center space-x-2";
                btn.innerHTML = `<i class="fa-solid fa-trash-can"></i><span>從行程移除</span>`;
                btn.onclick = () => { toggleItineraryItem(spot.id); openModal(spot.id); };
            } else {
                btn.className = "flex-1 py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-medium text-sm transition shadow-sm flex items-center justify-center space-x-2";
                btn.innerHTML = `<i class="fa-solid fa-plus"></i><span>加入我的行程</span>`;
                btn.onclick = () => { toggleItineraryItem(spot.id); openModal(spot.id); };
            }

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function toggleItineraryItem(id) {
            const spot = ATTRACTIONS.find(s => s.id === id);
            if (!spot) return;

            const index = itinerary.findIndex(item => item.id === id);
            if (index > -1) {
                itinerary.splice(index, 1);
                showToast(`已從行程移除「${spot.name}」`, 'info');
            } else {
                itinerary.push(spot);
                showToast(`已將「${spot.name}」加入行程！`, 'success');
            }

            localStorage.setItem('taiwan_trip_itinerary', JSON.stringify(itinerary));
            updateItineraryBadge();
            renderAttractionList();
            renderItineraryDrawer();
        }

        function updateItineraryBadge() {
            const count = itinerary.length;
            document.getElementById('itinerary-badge').textContent = count;
            const mobileBadge = document.getElementById('mobile-itinerary-badge');
            mobileBadge.textContent = count;
            mobileBadge.classList.toggle('hidden', count === 0);
        }

        function toggleItineraryDrawer() {
            const drawer = document.getElementById('itinerary-drawer');
            const isHidden = drawer.classList.contains('hidden');
            if (isHidden) {
                renderItineraryDrawer();
                drawer.classList.remove('hidden');
            } else {
                drawer.classList.add('hidden');
            }
        }

        function renderItineraryDrawer() {
            const container = document.getElementById('itinerary-list');
            document.getElementById('itinerary-total-count').textContent = itinerary.length;

            if (itinerary.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-400 space-y-2">
                        <i class="fa-solid fa-route text-4xl opacity-40"></i>
                        <p class="text-sm font-medium">行程目前是空的</p>
                        <p class="text-xs">快點擊景點卡片的「+」按鈕安排行程吧！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = itinerary.map((spot, index) => `
                <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl flex items-center justify-between space-x-3">
                    <div class="w-6 h-6 bg-brand-600 text-white font-bold text-xs rounded-full flex items-center justify-center flex-shrink-0">
                        ${index + 1}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-slate-800 text-sm truncate">${spot.name}</h4>
                        <p class="text-xs text-slate-500">${spot.county} · 停留約 ${spot.recommendedDuration}</p>
                    </div>
                    <button onclick="toggleItineraryItem(${spot.id})" class="text-slate-400 hover:text-rose-600 p-1 transition">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
            `).join('');
        }

        function clearItinerary() {
            if (itinerary.length === 0) return;
            itinerary = [];
            localStorage.removeItem('taiwan_trip_itinerary');
            updateItineraryBadge();
            renderAttractionList();
            renderItineraryDrawer();
            showToast('已清空所有行程', 'info');
        }

        function openRandomizer() {
            document.getElementById('randomizer-modal').classList.remove('hidden');
        }

        function closeRandomizer() {
            document.getElementById('randomizer-modal').classList.add('hidden');
        }

        function spinRandomizer() {
            const resultBox = document.getElementById('random-result');
            const diceIcon = document.getElementById('dice-icon');
            const btn = document.getElementById('btn-spin');

            btn.disabled = true;
            btn.classList.add('opacity-50');
            diceIcon.classList.add('animate-spin');

            let counter = 0;
            const interval = setInterval(() => {
                const randomSpot = ATTRACTIONS[Math.floor(Math.random() * ATTRACTIONS.length)];
                resultBox.innerHTML = `
                    <p class="font-bold text-brand-700 text-base animate-pulse">${randomSpot.name}</p>
                    <p class="text-xs text-slate-500 mt-1">${randomSpot.county}</p>
                `;
                counter++;

                if (counter > 15) {
                    clearInterval(interval);
                    diceIcon.classList.remove('animate-spin');
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');

                    // Final Pick
                    const finalPicked = ATTRACTIONS[Math.floor(Math.random() * ATTRACTIONS.length)];
                    resultBox.innerHTML = `
                        <div class="space-y-2">
                            <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full">命定地點</span>
                            <h4 class="font-bold text-slate-900 text-lg">${finalPicked.name}</h4>
                            <p class="text-xs text-slate-500">${finalPicked.county} · ⭐ ${finalPicked.rating}</p>
                            <button onclick="closeRandomizer(); focusOnSpot(${finalPicked.id}); openModal(${finalPicked.id})" class="mt-2 text-xs font-bold text-brand-600 hover:text-brand-700 flex items-center justify-center mx-auto">
                                查看景點詳情 <i class="fa-solid fa-arrow-right ml-1"></i>
                            </button>
                        </div>
                    `;
                }
            }, 100);
        }

        function setViewMode(mode) {
            const sidePanel = document.getElementById('side-panel');
            const mapPanel = document.getElementById('map-panel');

            // Reset buttons styling
            ['split', 'map', 'list'].forEach(m => {
                const btn = document.getElementById(`btn-view-${m}`);
                if (btn) btn.className = 'px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900';
            });
            document.getElementById(`btn-view-${mode}`).className = 'px-2.5 py-1.5 rounded-md bg-white shadow-sm text-slate-800 font-bold';

            if (mode === 'split') {
                sidePanel.classList.remove('hidden');
                mapPanel.classList.remove('hidden');
            } else if (mode === 'map') {
                sidePanel.classList.add('hidden');
                mapPanel.classList.remove('hidden');
            } else if (mode === 'list') {
                sidePanel.classList.remove('hidden');
                sidePanel.classList.replace('md:w-[420px]', 'w-full');
                sidePanel.classList.replace('lg:w-[460px]', 'w-full');
                mapPanel.classList.add('hidden');
            }

            setTimeout(() => { map.invalidateSize(); }, 200);
        }

        function setMobileTab(tab) {
            const sidePanel = document.getElementById('side-panel');
            const mapPanel = document.getElementById('map-panel');
            const listBtn = document.getElementById('mobile-tab-list');
            const mapBtn = document.getElementById('mobile-tab-map');

            if (tab === 'list') {
                sidePanel.classList.remove('hidden');
                mapPanel.classList.add('hidden');
                listBtn.className = 'flex flex-col items-center justify-center flex-1 h-full text-brand-600 font-medium';
                mapBtn.className = 'flex flex-col items-center justify-center flex-1 h-full text-slate-500 font-medium';
            } else {
                sidePanel.classList.add('hidden');
                mapPanel.classList.remove('hidden');
                listBtn.className = 'flex flex-col items-center justify-center flex-1 h-full text-slate-500 font-medium';
                mapBtn.className = 'flex flex-col items-center justify-center flex-1 h-full text-brand-600 font-medium';
                setTimeout(() => { map.invalidateSize(); }, 200);
            }
        }

        /* Custom Toast System */
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            const bgClass = type === 'success' ? 'bg-slate-900 text-white' : 'bg-slate-800 text-white';
            const icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-brand-500 mr-2"></i>' : '<i class="fa-solid fa-circle-info text-sky-400 mr-2"></i>';

            toast.className = `${bgClass} px-4 py-2.5 rounded-xl shadow-lg text-xs font-medium flex items-center pointer-events-auto transition duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `${icon}<span>${message}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
